[project]
name = "dbt-macro-test"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hirofumi Tsuda" }
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.3,<9",
    "dbt-core>=1.12.5",
    "pyyaml>=6",
]

[project.scripts]
dbt-macro-test = "dbt_macro_test.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "dbt-duckdb>=1.11.0",
    "mypy>=2.4.1",
    "pytest>=9.1.1",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12.20261122",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
implicit_reexport = true
disallow_untyped_calls = false

[tool.pytest.ini_options]
markers = ["e2e: runs dbt against a real project (slower)"]
