[project]
name = "dbt-macro-test"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hirofumi Tsuda" }
]
requires-python = ">=3.13"
dependencies = [
    "dbt-core>=1.12.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "dbt-duckdb>=1.11.0",
    "mypy>=2.4.1",
    "pytest>=9.1.1",
    "ruff>=0.17.6",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
strict = true
implicit_reexport = true
disallow_untyped_calls = false
