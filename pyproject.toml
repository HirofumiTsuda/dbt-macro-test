[project]
name = "dbt-macro-test"
version = "0.1.0"
description = "Unit tests for dbt macros, built on dbt's native unit tests"
keywords = ["dbt", "macro", "jinja", "sql", "testing", "unit-test"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
readme = "README.md"
license = "MIT"
authors = [
    { name = "Hirofumi Tsuda" }
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.3,<9",
    "dbt-core>=1.8,<2",
    "pyyaml>=6",
]

[project.urls]
Repository = "https://github.com/HirofumiTsuda/dbt-macro-test"
Issues = "https://github.com/HirofumiTsuda/dbt-macro-test/issues"
Changelog = "https://github.com/HirofumiTsuda/dbt-macro-test/blob/main/CHANGELOG.md"
Documentation = "https://github.com/HirofumiTsuda/dbt-macro-test/blob/main/docs/spec.md"

[project.scripts]
dbt-macro-test = "dbt_macro_test.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "dbt-duckdb>=1.11.0",
    "mypy>=2.4.1",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12.20261122",
]
docs = [
    "zensical>=0.1.3",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
implicit_reexport = true
disallow_untyped_calls = false

[tool.pytest.ini_options]
markers = ["e2e: runs dbt against a real project (slower)"]
addopts = "-n auto --maxprocesses=4"
