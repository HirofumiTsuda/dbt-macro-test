# The configuration of the documentation site. It is built by Zensical (`zensical build`), which
# reads this file as it is; the name stays mkdocs.yml, which is what Zensical recommends for a project
# that comes from MkDocs.
site_name: dbt-macro-test
site_description: Test your dbt macros.
site_url: https://hirofumitsuda.github.io/dbt-macro-test/
repo_url: https://github.com/HirofumiTsuda/dbt-macro-test
repo_name: HirofumiTsuda/dbt-macro-test
edit_uri: edit/main/docs/

docs_dir: docs
exclude_docs: |
  images/README.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.top
    - navigation.sections

validation:
  anchors: warn      # a link to a heading that is not there is a warning, so an error under --strict

nav:
  - Home: index.md
  - Guide: guide.md
  - Spec reference: spec.md
  - Design: design.md
  - Changelog: changelog.md
  - Project:
      - Releasing: releasing.md
      - Design log: history/design-log.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
