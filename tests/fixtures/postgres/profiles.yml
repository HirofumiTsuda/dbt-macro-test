# The fixture project of the tests (tests/fixtures/project) on Postgres (#116), for `--profiles-dir`.
# The connection is the defaults of the container that the CI job uses, and of dev/sample_project/postgres.
fixture_project:
  target: postgres
  outputs:
    postgres:
      type: postgres
      host: "{{ env_var('DMT_PG_HOST', 'localhost') }}"
      port: "{{ env_var('DMT_PG_PORT', '5432') | as_number }}"
      user: "{{ env_var('DMT_PG_USER', 'dmt') }}"
      password: "{{ env_var('DMT_PG_PASSWORD', 'dmt') }}"
      dbname: "{{ env_var('DMT_PG_DB', 'dmt') }}"
      schema: public       # a relation that is not temporary needs the schema to exist (#127)
      threads: 1
