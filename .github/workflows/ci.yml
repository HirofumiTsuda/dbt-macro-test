name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Every job runs on every pull request, because the required checks of `main` are listed by name
# and a job that did not run would leave its check pending for ever. A job whose pull request
# changes only documentation decides that in its first step (.github/scripts/ci_scope.sh), and
# its other steps are skipped, so it still reports success under its own name (#65).

jobs:
  check:
    name: check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - id: scope
        run: bash .github/scripts/ci_scope.sh

      - if: steps.scope.outputs.code == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - if: steps.scope.outputs.code == 'true'
        run: uv sync --locked

      - if: steps.scope.outputs.code == 'true'
        run: uv run ruff check .

      - if: steps.scope.outputs.code == 'true'
        run: uv run ruff format --check .

      - if: steps.scope.outputs.code == 'true'
        run: uv run mypy

      - if: steps.scope.outputs.code == 'true'
        run: uv run pytest

  oldest-dbt:
    # dbt-core 1.8 is the oldest version with native unit tests; the job above runs the
    # newest one (the lock file's), this runs the oldest.
    name: check (dbt-core 1.8)
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - id: scope
        run: bash .github/scripts/ci_scope.sh

      - if: steps.scope.outputs.code == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - if: steps.scope.outputs.code == 'true'
        run: uv sync --locked

      - if: steps.scope.outputs.code == 'true'
        run: uv pip install "dbt-core==1.8.*" "dbt-duckdb==1.8.*"

      - if: steps.scope.outputs.code == 'true'
        run: uv run --no-sync pytest

  windows:
    # Python 3.13 only: the suite is the same, and the system is what differs.
    name: check (Windows)
    runs-on: windows-latest
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - id: scope
        shell: bash
        run: bash .github/scripts/ci_scope.sh

      - if: steps.scope.outputs.code == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - if: steps.scope.outputs.code == 'true'
        run: uv sync --locked

      - if: steps.scope.outputs.code == 'true'
        run: uv run pytest
