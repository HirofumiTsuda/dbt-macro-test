name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Every job runs on every pull request, because the required checks of `main` are listed by name
# and a job that did not run would leave its check pending for ever. The `changes` job says
# whether a pull request changes more than documentation (the globs are in it, and only there),
# and the other jobs skip their steps when it does not, so they still report success under their
# own names (#65). A push to `main`, and any failure of `changes`, run everything.

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - if: github.event_name == 'pull_request'
        id: scope
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!website/**'
              - '!*.md'
              - '!LICENSE'
              - '!.github/PULL_REQUEST_TEMPLATE.md'

  check:
    name: check (Python ${{ matrix.python-version }})
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: needs.changes.outputs.code != 'false'
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - if: needs.changes.outputs.code != 'false'
        run: uv sync --locked

      - if: needs.changes.outputs.code != 'false'
        run: uv run ruff check .

      - if: needs.changes.outputs.code != 'false'
        run: uv run ruff format --check .

      - if: needs.changes.outputs.code != 'false'
        run: uv run mypy

      - if: needs.changes.outputs.code != 'false'
        run: uv run pytest

  oldest-dbt:
    # dbt-core 1.8 is the oldest version with native unit tests; the job above runs the
    # newest one (the lock file's), this runs the oldest.
    name: check (dbt-core 1.8)
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: needs.changes.outputs.code != 'false'
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - if: needs.changes.outputs.code != 'false'
        run: uv sync --locked

      - if: needs.changes.outputs.code != 'false'
        run: uv pip install "dbt-core==1.8.*" "dbt-duckdb==1.8.*"

      - if: needs.changes.outputs.code != 'false'
        run: uv run --no-sync pytest

  windows:
    # Python 3.13 only: the suite is the same, and the system is what differs.
    name: check (Windows)
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: needs.changes.outputs.code != 'false'
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - if: needs.changes.outputs.code != 'false'
        run: uv sync --locked

      - if: needs.changes.outputs.code != 'false'
        run: uv run pytest

  postgres:
    # The sample project and the project of the tests against a real Postgres (#116): the first adapter
    # other than duckdb. It is not
    # a required check of main until it has been seen to be stable.
    name: sample (Postgres)
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dmt
          POSTGRES_PASSWORD: dmt
          POSTGRES_DB: dmt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dmt -d dmt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: needs.changes.outputs.code != 'false'
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - if: needs.changes.outputs.code != 'false'
        run: uv sync --locked --group postgres

      # the schema of the sample's profile: a relation that is not temporary (#142) is made in it, and
      # the tool makes the relation, not the schema
      - if: needs.changes.outputs.code != 'false'
        run: PGPASSWORD=dmt psql -h localhost -U dmt -d dmt -c 'create schema if not exists dmt_sample'

      # the connection is the defaults of dev/sample_project/postgres/profiles.yml, which are those of
      # the container above
      - if: needs.changes.outputs.code != 'false'
        run: uv run dbt-macro-test run --project-dir dev/sample_project --profiles-dir dev/sample_project/postgres

      # the project of the tests, which has more of the tool's features than the sample has
      - if: needs.changes.outputs.code != 'false'
        run: uv run dbt-macro-test run --project-dir tests/fixtures/project --profiles-dir tests/fixtures/postgres

  spark:
    # A project on Spark with Delta (#132): relations that are not temporary (#127), written by an
    # INSERT and by a MERGE, and dropped afterwards (#128); and the sample project, all of it (#142).
    # A session of its own, no cluster; the Delta library is fetched from Maven when it starts. It is not a required check of main until
    # the time and the stability have been seen.
    name: spark (Delta)
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.13"
      DMT_SPARK_WAREHOUSE: ${{ github.workspace }}/spark-warehouse
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: needs.changes.outputs.code != 'false'
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - if: needs.changes.outputs.code != 'false'
        run: uv sync --locked --group spark

      - if: needs.changes.outputs.code != 'false'
        run: uv run dbt-macro-test run --project-dir tests/fixtures/spark_project --profiles-dir tests/fixtures/spark

      - if: needs.changes.outputs.code != 'false'
        run: uv run dbt-macro-test run --project-dir dev/sample_project --profiles-dir dev/sample_project/spark

      # the tool drops the relations of the cases of both runs; one that is left is a failure of the
      # drop, which the run does not say by its exit code
      - if: needs.changes.outputs.code != 'false'
        run: |
          left=$(ls "$DMT_SPARK_WAREHOUSE" 2>/dev/null | grep '^_dmt_' || true)
          if [ -n "$left" ]; then echo "left in the warehouse:"; echo "$left"; exit 1; fi

  docs:
    # The documentation site must build, with a broken link or a missing heading as an error. It
    # runs on every pull request, since that is what it checks (#97).
    name: docs (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: website/.node-version
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci

      - run: npm run build
