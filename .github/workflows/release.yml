name: Release

# A tag `vX.Y.Z` builds the package, checks it, installs it into a clean environment and
# runs it on a project, and then, after an approval, publishes it to PyPI. Nothing is published
# without the approval of the `pypi` environment. See docs/releasing.md.
#
# The build and the smoke test also run for a pull request that touches what a release is made
# of, so that a broken package is found before the tag.
#
# A manual run (workflow_dispatch) publishes to TestPyPI, as a dry run of the whole thing.
#
# After the publication to PyPI, a job makes the GitHub release from the changelog and attaches the
# files that were published (#122).

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
    paths:
      - pyproject.toml
      - CHANGELOG.md
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: The version, the tag and the changelog agree
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "pyproject.toml says $version"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "::error::the tag is $GITHUB_REF_NAME, pyproject.toml says $version"; exit 1; }
          fi
          grep -qE "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no heading '## [$version]'"; exit 1; }
          # the GitHub release is made from this entry, so it has to have its highlights (not a dry run)
          case "$version" in *.dev*) ;; *) python3 .github/scripts/release_notes.py "$version" > /dev/null ;; esac

      - run: uv build

      - name: The distributions are well formed, and hold what they should
        run: |
          uvx twine check --strict dist/*
          unzip -l dist/*.whl | grep -E "dbt_macro_test/py\.typed"
          unzip -l dist/*.whl | grep -E "licenses/LICENSE"
          tar -tzf dist/*.tar.gz | grep -E "/LICENSE$"
          unzip -l dist/*.whl | grep -E "dbt_macro_test/project/macros/_dmt_drop\.sql"
          tar -tzf dist/*.tar.gz | grep -E "/project/macros/_dmt_drop\.sql$"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke:
    # What was built, not the checkout, installed into a clean environment and run on a project.
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kind: [wheel, sdist]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Install it into a new environment
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/venv"
          if [ "${{ matrix.kind }}" = wheel ]; then file=$(ls dist/*.whl); else file=$(ls dist/*.tar.gz); fi
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" dbt-duckdb "$file"

      - name: It is the installed package that runs
        run: |
          "$RUNNER_TEMP/venv/bin/python" -c "import dbt_macro_test; print(dbt_macro_test.__file__)" | tee /dev/stderr | grep -q site-packages
          "$RUNNER_TEMP/venv/bin/dbt-macro-test" --help
          "$RUNNER_TEMP/venv/bin/python" -c "from dbt_macro_test.project.generate import cleanup_macro; assert 'macro _dmt_drop' in cleanup_macro()"

      - name: Run it on a project
        run: |
          cp -r tests/fixtures/project "$RUNNER_TEMP/project"
          cd "$RUNNER_TEMP/project"
          "$RUNNER_TEMP/venv/bin/dbt-macro-test" run

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: smoke
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: github.ref_type == 'tag'
    needs: smoke
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    # Only after the publication: a version that was not published has no release. This job alone
    # may write to the repository, and a failure of it does not undo the publication: the release
    # can be made by hand with the same script (docs/releasing.md).
    if: github.ref_type == 'tag'
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tags, for the link to the comparison with the previous one

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: The notes, from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          python3 .github/scripts/release_notes.py "$version" ${previous:+--previous "${previous#v}"} \
            --repo "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: The release, with the files that were published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # a version with letters in it (0.3.0rc1) is a pre-release, and not the latest
          case "$version" in *[a-zA-Z]*) kind=--prerelease ;; *) kind=--latest ;; esac
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$version" --notes-file "$RUNNER_TEMP/notes.md" "$kind"
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$version" \
              --notes-file "$RUNNER_TEMP/notes.md" "$kind"
          fi
