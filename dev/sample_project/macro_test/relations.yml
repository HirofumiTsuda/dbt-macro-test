# A macro that writes to a relation, or reads one. The tool makes the relations of the case
# (`setup.relations`, from rows or from a select), as temporary ones, and drops them afterwards;
# the macro is given them as arguments: `{type: jinja, value: relations.<name>}`.
#
# A relation that a macro writes to says `temporary: false`: on Spark a temporary relation is a view,
# which cannot be written to (#127), so these specs run on Spark too (#142). On the other adapters
# the tool makes a table, as for any `temporary: false`, and drops it afterwards; a relation that is
# only read stays temporary.
#
# These cases run SQL in the warehouse of the target: a macro that named a real table itself
# would write it. Here duckdb is in memory. Run specs like these on a local or throwaway target.
macros:
  - macro: upsert_orders
    cases:
      - name: updates_the_changed_orders_and_adds_the_new_ones
        setup:
          relations:
            target:
              temporary: false           # a macro writes to it: see the top of the file
              rows:
                - {id: 1, status: open}
                - {id: 2, status: open}
            source:                      # a select of your own, instead of rows
              sql: select 2 as id, 'shipped' as status union all select 3, 'open'
        given:
          arguments:
            target: {type: jinja, value: relations.target}
            source: {type: jinja, value: relations.source}
        expect:
          query: select * from {{ relations.target }}    # what to compare, after the macro has run
          rows:
            - {id: 1, status: open}
            - {id: 2, status: shipped}
            - {id: 3, status: open}

  - macro: record_update                           # a macro that reads `this`, for a post-hook
    cases:
      - name: records_a_table_that_is_new
        setup:
          relations:
            registry:
              temporary: false
              sql: select 'other' as full_name, timestamp '2000-01-01' as updated_at
        given:
          arguments:
            registry: {type: jinja, value: relations.registry}
        expect:
          # `this` is the generated model's, and its name has the id of the run in it: it is
          # compared in the query, not written in the rows. Nor can the time be: the row has an
          # old time, and the case checks that the new one is later
          query: >
            select full_name = '{{ this }}' as is_this, updated_at > timestamp '2020-01-01' as is_recent
            from {{ relations.registry }} order by is_this
          rows:
            - {is_this: false, is_recent: false}   # another table is left as it was
            - {is_this: true, is_recent: true}
      - name: updates_a_table_that_is_there_and_does_not_add_it_twice
        setup:
          relations:
            registry:
              temporary: false
              sql: select '{{ this }}' as full_name, timestamp '2000-01-01' as updated_at
        given:
          arguments:
            registry: {type: jinja, value: relations.registry}
        expect:
          query: select count(*) as n, bool_and(updated_at > timestamp '2020-01-01') as is_recent from {{ relations.registry }}
          rows:
            - {n: 1, is_recent: true}

  - macro: remove_cancelled
    cases:
      - name: keeps_the_orders_that_are_not_cancelled
        setup:
          relations:
            orders:
              temporary: false
              rows:
                - {id: 1, status: open}
                - {id: 2, status: cancelled}
                - {id: 3, status: shipped}
        given:
          arguments:
            orders: {type: jinja, value: relations.orders}
        expect:
          query: select id, status from {{ relations.orders }}
          rows:
            - {id: 1, status: open}
            - {id: 3, status: shipped}

  - macro: order_total
    cases:
      - name: adds_up_the_amounts_of_a_relation       # no query: the macro's value is compared
        setup:
          relations:
            orders:
              rows:
                - {id: 1, amount: 1000}
                - {id: 2, amount: 250}
        given:
          arguments:
            orders: {type: jinja, value: relations.orders}
        expect:
          rows:
            - {result: 1250}

  - macro: archive_cancelled                       # a macro that writes with a `statement` block
    cases:
      - name: copies_only_the_cancelled_orders
        setup:
          relations:
            orders:
              rows:
                - {id: 1, status: open}
                - {id: 2, status: cancelled}
            archive:
              temporary: false
              sql: select 0 as id, 'cancelled' as status where false   # an empty relation, of the same columns
        given:
          arguments:
            orders: {type: jinja, value: relations.orders}
            archive: {type: jinja, value: relations.archive}
        expect:
          query: select id, status from {{ relations.archive }}
          rows:
            - {id: 2, status: cancelled}

  - macro: order_columns                           # a macro that reads through `adapter`
    cases:
      - name: names_the_columns_of_a_relation
        output: text                               # the macro returns text, not an expression
        setup:
          relations:
            orders:
              rows:
                - {id: 1, status: open, amount: 100}
        given:
          arguments:
            orders: {type: jinja, value: relations.orders}
        expect:
          rows:
            - {result: "id,status,amount"}

  - macro: merge_orders_sql                        # returns the text of a statement, not a result
    cases:
      - name: the_statement_it_returns_merges_the_rows
        run: execute                               # run what the macro returns, then compare
        setup:
          relations:
            target:
              temporary: false
              rows:
                - {id: 1, status: open}
                - {id: 2, status: open}
            source:
              rows:
                - {id: 2, status: shipped}
                - {id: 3, status: open}
        given:
          arguments:
            target: {type: jinja, value: relations.target}
            source: {type: jinja, value: relations.source}
        expect:
          query: select id, status from {{ relations.target }} order by id
          rows:
            - {id: 1, status: open}
            - {id: 2, status: shipped}
            - {id: 3, status: open}
